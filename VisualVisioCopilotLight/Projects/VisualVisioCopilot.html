
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="mermaid.min.css">
</head>
<body>
<div id="diagram">
  <div class="mermaid">
graph TD;
    A[Begin] --> B[Test Step]
    B -->|Condition True| C[Step 1]
    B -->|Condition False| D[Step 2]
    C --> E[End Test]
    D --> E[End Test]

  </div>
</div>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
</script>
  <script>
    var config = {
                startOnLoad:true,
                flowchart:{
                        useMaxWidth:false,
                    }
            };
    mermaid.initialize(config);
  </script>
</body>
</html>
